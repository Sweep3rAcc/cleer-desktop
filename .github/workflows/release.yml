# mr opsec
name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Find the installer
        shell: pwsh
        run: |
          Write-Host "Files found:"
          Get-ChildItem -Path release, dist -Recurse -Include *.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          $exe = Get-ChildItem -Path release, dist -Recurse -Include *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'win-unpacked' -and $_.Name -match 'Setup' } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "No installer was built"; exit 1 }
          Copy-Item $exe.FullName "Cleer-Setup.exe"

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Cleer-Setup
          path: Cleer-Setup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Cleer-Setup.exe
