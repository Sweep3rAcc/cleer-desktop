<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cleer</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0a0a0b;color:#f5f6f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .box{text-align:center;max-width:340px;padding:24px}
  h1{font-size:22px;font-weight:600;margin:18px 0 8px}
  p{color:#a3a8b2;font-size:15px;line-height:1.5;margin:0 0 22px}
  button{background:#34d399;color:#04140c;border:0;border-radius:12px;height:46px;padding:0 22px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4.6"/></svg>
  <h1>You're offline</h1>
  <p>Cleer needs an internet connection to open. It will reconnect on its own, or you can try now.</p>
  <button id="retry">Try again</button>
</div>
<script>
  var target = new URLSearchParams(location.search).get('url') || 'https://www.cleer.app';
  function go(){ location.href = target; }
  document.getElementById('retry').onclick = go;
  setInterval(function(){
    fetch(target, { mode: 'no-cors', cache: 'no-store' }).then(go).catch(function(){});
  }, 5000);
</script>
</body>
</html>
